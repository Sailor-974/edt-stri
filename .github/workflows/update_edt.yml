name: Mise à jour EDT STRI

on:
  schedule:
    # Format Cron (UTC) : Minutes Heures Jour Mois JourSemaine
    # Correspond à 6h, 12h, 18h et 22h heure de Paris (Hiver)
    - cron: '0 5,11,17,21 * * *'
  workflow_dispatch: # Bouton pour lancer manuellement depuis l'interface GitHub

permissions:
  contents: write # Autorise le bot à modifier les fichiers du dépôt

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du script de lecture PDF
        run: python main.py

      - name: Sauvegarde et publication du nouveau ICS
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add *.ics
          # Ne crée un commit que si le fichier .ics a réellement été modifié (ex: une salle ajoutée)
          git diff-index --quiet HEAD || git commit -m "Mise à jour automatique de l'EDT"
          git push